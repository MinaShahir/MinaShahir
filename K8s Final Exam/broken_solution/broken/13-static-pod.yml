apiVersion: v1
kind: Pod
metadata:
  name: node-monitor
spec:
  containers:
    - name: mon
      image: busybox
      command: ["sh","-c","echo ok"]
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:        # CHANGED: corrected hostpath to hostPath
        path: /
        type: Directory
  # CHANGED: Added restartPolicy at the Pod spec level (absent in original).
  restartPolicy: Always