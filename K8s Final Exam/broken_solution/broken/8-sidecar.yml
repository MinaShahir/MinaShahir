apiVersion: v1
kind: Pod
metadata:
  name: sidecar-app
spec:
  containers:
    - name: app
      image: nginx
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: logger
      image: busybox
      command: ["sh", "-c", "tail -f /data"]
      # FIXED: added volumeMounts so the logger container can access the shared volume.
      volumeMounts:
        - name: shared
          mountPath: /data
  # FIXED: added volumes section so 'shared' is defined. Using emptyDir for a simple in-memory shared volume.
  volumes:
    - name: shared
      emptyDir: {}
