# Static pods are usually placed directly on the node filesystem under /etc/kubernetes/manifests/.
# Example manifest for monitor-agent (drop this file on the master node at /etc/kubernetes/manifests/monitor-agent.yaml)
apiVersion: v1
kind: Pod
metadata:
  name: monitor-agent
spec:
  containers:
  - name: monitor
    image: busybox
    command: ["sh", "-c", "while true; do sleep 3600; done"]
