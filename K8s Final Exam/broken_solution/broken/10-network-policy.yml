apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
spec:
  podSelector:
    matchLabels:                     # <-- changed: replaced invalid "name: backend" with matchLabels
      name: backend                    # <-- changed: moved "backend" under matchLabels to select pods with label name=backend

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
